<html lang="hi">

<script>
(function(){
  try{if(window.top!==window.self){document.documentElement.style.display="none";window.top.location=window.self.location}}catch(e){document.documentElement.style.display="none"}
  var d=document.documentElement,t;try{t=localStorage.getItem("ug_theme")}catch(e){}
  if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  d.dataset.theme=t;
})();
</script>
<style>
:root{color-scheme:dark;--bg:#070C1E;--bg2:#0d1636;--card:#0e1732;--card2:#131f42;--bd:#22305a;--tx:#e9eefc;--mu:#9aa8cc;--acc:#f5b82e;--acct:#f5b82e;--blue:#4a74ff;--red:#ff5d6c;--grn:#34d399;--hd:rgba(10,17,48,.8)}
:root[data-theme="light"]{color-scheme:light;--bg:#f3f6fc;--bg2:#e8eefb;--card:#fff;--card2:#eaf0fb;--bd:#d8e0f0;--tx:#10203f;--mu:#56658a;--acc:#f5b82e;--acct:#9a5b00;--blue:#2f5bff;--red:#e5384b;--grn:#0f9d6b;--hd:rgba(255,255,255,.85)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:100vw;overflow-x:hidden;background:radial-gradient(1000px 600px at 50% -10%,var(--bg2),var(--bg));background-color:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Nirmala UI",sans-serif;padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0)}
a{color:inherit}
svg{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:12px}
header{position:sticky;top:0;z-index:30;background:var(--hd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0)}
.nav{max-width:860px;margin:auto;height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand img{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 2px var(--acc)}
.brand b{display:block;font-size:16.5px;line-height:1.15;white-space:nowrap}.brand small{display:block;color:var(--acct);font-size:11.5px;line-height:1.2;white-space:nowrap}
.r{display:flex;align-items:center;gap:8px}
.lnk{text-decoration:none;font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);white-space:nowrap}
.ib{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;cursor:pointer}
.ib svg{width:19px;height:19px}.ib .sun{display:none}
:root[data-theme="dark"] .ib .sun{display:block}:root[data-theme="dark"] .ib .moon{display:none}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:18px 16px 30px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px 18px;box-shadow:0 12px 30px -18px rgba(0,0,0,.5)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.b{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card2);color:var(--acct)}
.b.dl{background:#ffe9d2;color:#9a4a00}:root[data-theme="dark"] .b.dl{background:#3a2410;color:#ffb066}
.b.new{background:var(--red);color:#fff}
.un{display:block;margin:14px 0 4px;font-weight:800;font-size:15.5px;color:var(--acct)}
h1{margin:0;font-size:clamp(20px,5vw,26px);line-height:1.4;overflow-wrap:anywhere}
.meta{margin-top:10px;color:var(--mu);font-size:14px}
.desc{margin:14px 0 0;color:var(--mu);font-size:15px;line-height:1.75;white-space:pre-line;overflow-wrap:anywhere}
.cnt{margin-top:14px;padding:11px 14px;border-radius:12px;background:var(--card2);font-size:14.5px}
.cnt b{color:var(--red)}.cnt.ok b{color:var(--grn)}
.act{display:grid;gap:10px;margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);text-decoration:none;font-weight:700;font-size:15.5px;line-height:1;font-family:inherit;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:linear-gradient(135deg,#ffe08a,#f5b82e);color:#1a1300;border-color:transparent;font-size:17px;min-height:56px;box-shadow:0 12px 26px -10px rgba(245,184,46,.6)}
.btn svg{width:18px;height:18px}
.two{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.note{margin-top:14px;font-size:13px;color:var(--mu)}
.ad{display:none;margin:16px 0;text-align:center;min-height:100px;overflow:hidden}.ad.on{display:block}.ad small{display:block;color:var(--mu);font-size:10px;letter-spacing:1px}
h2{font-size:clamp(17px,4.4vw,20px);margin:26px 0 10px}
.rel{display:grid;gap:10px}
.rl{display:block;text-decoration:none;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--bd);transition:border-color .2s,transform .2s}
.rl:hover{border-color:var(--blue);transform:translateY(-2px)}
.rl b{display:block;font-size:15px;line-height:1.45;overflow-wrap:anywhere}.rl small{color:var(--mu);font-size:12.5px}
.sk{height:200px;border-radius:20px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:36px 16px}.empty h1{font-size:20px}.empty p{color:var(--mu)}
footer{border-top:1px solid var(--bd);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));text-align:center;color:var(--mu);font-size:13px}
footer a{margin:0 7px;color:var(--mu);text-decoration:none;line-height:2.2}footer a:hover{color:var(--acct)}
@media(max-width:420px){.lnk{padding:9px 10px;font-size:13px}.brand b{font-size:15px}.brand img{width:34px;height:34px}.nav{padding:0 12px}}
@media(max-width:380px){.brand small{display:none}.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header><div class="nav">
  <a class="brand" href="./" aria-label="University Gyaan Home"><img alt="" src="logo.png" width="38" height="38"><span><b>University Gyaan</b><small>by Sanjeev Chauhan</small></span></a>
  <div class="r"><a class="lnk" href="notices.html">सभी Updates</a>
  <button class="ib" id="tg" type="button" aria-label="Dark / Light mode बदलें"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button></div>
</div></header>

<main id="main" aria-live="polite">
  <div class="sk" id="sk"></div>
  <div id="view" hidden></div>
</main>

<footer>
  <div><a href="./">Home</a><a href="notices.html">Updates</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms</a><a href="disclaimer.html">Disclaimer</a></div>
  <p style="margin:6px 0 0">© <span id="yr">2026</span> University Gyaan (by Sanjeev Chauhan). All Rights Reserved.</p>
</footer>

<script>
(function(){
"use strict";
var CFG={
  db:"https://university-notice-bot-default-rtdb.asia-southeast1.firebasedatabase.app",
  adClient:"ca-pub-9281139746143386",slots:{top:"",bot:""},
  tg:"https://t.me/Univesity_Gyaan",wa:"https://whatsapp.com/channel/0029Va8mCyHDuMRolLgWPM2S"
};
var TYPES={notice:"Notice",result:"Result",datesheet:"Datesheet",admit:"Admit Card",form:"Exam Form",study:"Study Material",video:"Videos",other:"Other"};
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var fixU=function(u){u=String(u||"").trim();return /^https?:\/\//i.test(u)?u:/^\/\//.test(u)?"https:"+u:/^www\./i.test(u)?"https://"+u:""};
var iso=function(d){return d.toISOString().slice(0,10)},todayS=iso(new Date());
var fmt=function(d){if(!d)return"";var x=new Date(d+"T00:00:00");return isNaN(x)?d:x.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})};
var left=function(d){return Math.round((new Date(d+"T00:00:00")-new Date(todayS+"T00:00:00"))/864e5)};

$("yr").textContent=new Date().getFullYear();
function theme(t){document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==="dark"?"#070C1E":"#f3f6fc"}
theme(document.documentElement.dataset.theme||"dark");
$("tg").addEventListener("click",function(){var t=document.documentElement.dataset.theme==="dark"?"light":"dark";theme(t);try{localStorage.setItem("ug_theme",t)}catch(e){}});

function adBox(el,slot){if(!el||!CFG.adClient||!slot)return;el.classList.add("on");
  el.insertAdjacentHTML("beforeend",'<ins class="adsbygoogle" style="display:block" data-ad-client="'+CFG.adClient+'" data-ad-slot="'+esc(slot)+'" data-ad-format="auto" data-full-width-responsive="true"></ins>');
  try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}}

function show(html){$("sk").hidden=true;var v=$("view");v.innerHTML=html;v.hidden=false}
function notFound(){document.title="Notice नहीं मिली – University Gyaan";
  show('<div class="card empty"><h1>यह Notice उपलब्ध नहीं है</h1><p>Link गलत हो सकता है या Notice हटा दी गई है।</p><p><a class="btn pri" href="notices.html">सभी Updates देखिए</a></p></div>')}

var id=(new URLSearchParams(location.search).get("id")||"").trim();
if(!/^[-_A-Za-z0-9]{4,120}$/.test(id)){notFound();return}

Promise.all([
  fetch(CFG.db+"/web/posts/"+encodeURIComponent(id)+".json").then(function(r){if(!r.ok)throw 0;return r.json()}),
  fetch(CFG.db+"/web/names.json").then(function(r){return r.ok?r.json():{}}).catch(function(){return{}})
]).then(function(res){
  var p=res[0],NM=res[1]||{};
  if(!p||p.hide||!p.title){notFound();return}
  var mp={};Object.keys(NM).forEach(function(k){var m=NM[k];if(m&&m.f)mp[m.f]=m});
  var raw=p.uni,m=mp[p.uni];if(m&&m.t)p.uni=m.t;
  render(p,raw,mp);
}).catch(function(){
  show('<div class="card empty"><h1>Notice load नहीं हो सकी</h1><p>Internet जाँचिए और दोबारा कोशिश कीजिए।</p><p><a class="btn pri" href="">दोबारा कोशिश करें</a></p></div>')
});

function render(p,raw,mp){
  var u=fixU(p.url),dl=p.deadline?left(p.deadline):null,isNew=(Date.now()/1000-(p.ts||0))<172800;
  document.title=p.title+" – University Gyaan";
  var md=document.querySelector('meta[name=description]');if(md)md.content=(p.uni?p.uni+": ":"")+p.title;
  var h='<article class="card"><div class="row"><span class="b">'+esc(TYPES[p.type]||"Notice")+'</span>'+(isNew?'<span class="b new">NEW</span>':"")+(dl!==null&&dl>=0?'<span class="b dl">अंतिम तिथि '+esc(fmt(p.deadline))+'</span>':"")+'</div>'
   +(p.uni?'<span class="un">'+esc(p.uni)+'</span>':"")
   +'<h1>'+esc(p.title)+'</h1><div class="meta">'+(p.date?esc(fmt(p.date)):"")+'</div>'
   +(dl!==null&&dl>=0?'<div class="cnt'+(dl>5?" ok":"")+'">⏰ अंतिम तिथि में <b>'+(dl===0?"आज आख़िरी दिन है":dl+" दिन बाकी हैं")+'</b></div>':"")
   +(p.desc?'<p class="desc">'+esc(p.desc)+'</p>':"")
   +'<div class="ad" id="ad-top"><small>विज्ञापन</small></div>'
   +'<div class="act">'
   +(u?'<a class="btn pri" id="open" target="_blank" rel="noopener noreferrer" href="'+esc(u)+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>Notice खोलिए (Official Link)</a>':'<div class="cnt">इस notice का सीधा link उपलब्ध नहीं है। कृपया University की official website देखिए।</div>')
   +'<div class="two"><a class="btn" id="wa" target="_blank" rel="noopener noreferrer" href="#">WhatsApp पर शेयर</a><button class="btn" id="cp" type="button">Link कॉपी</button></div>'
   +'</div>'
   +'<p class="note">यह Notice University/College की official website से ली गई है। किसी भी फ़ैसले से पहले official site पर मिलान ज़रूर कर लें।</p></article>'
   +'<div class="ad" id="ad-bot"><small>विज्ञापन</small></div>'
   +'<div id="relw"></div>'
   +'<h2>और Updates के लिए जुड़िए</h2><div class="two"><a class="btn" target="_blank" rel="noopener noreferrer" href="'+CFG.tg+'">Telegram Channel</a><a class="btn" target="_blank" rel="noopener noreferrer" href="'+CFG.wa+'">WhatsApp Channel</a></div>';
  show(h);
  var here=location.href;
  $("wa").href="https://wa.me/?text="+encodeURIComponent(p.title+"\n"+here+"\n— University Gyaan");
  $("cp").onclick=function(){var b=$("cp");(navigator.clipboard?navigator.clipboard.writeText(here):Promise.reject()).then(function(){b.textContent="✅ कॉपी हो गया"}).catch(function(){prompt("Link कॉपी कीजिए:",here)})};
  adBox($("ad-top"),CFG.slots.top);adBox($("ad-bot"),CFG.slots.bot);
  related(p,raw,mp);
}

function related(p,raw,mp){
  fetch(CFG.db+"/web/posts.json").then(function(r){return r.ok?r.json():{}}).then(function(o){
    o=o||{};
    var rows=Object.keys(o).map(function(k){var v=o[k];v.id=k;return v}).filter(function(v){return v&&!v.hide&&v.id!==id&&v.title&&v.uni===raw})
      .sort(function(a,b){return (b.ts||0)-(a.ts||0)}).slice(0,6);
    if(!rows.length)return;
    var m=mp[raw];
    $("relw").innerHTML='<h2>'+esc((m&&m.t)||raw)+' की और Updates</h2><div class="rel">'+rows.map(function(v){
      return '<a class="rl" href="notice.html?id='+encodeURIComponent(v.id)+'"><b>'+esc(v.title)+'</b><small>'+esc(TYPES[v.type]||"Notice")+(v.date?' · '+esc(fmt(v.date)):"")+'</small></a>'}).join("")+'</div>'
      +'<p style="text-align:center;margin-top:14px"><a class="btn" href="notices.html">सभी Updates देखिए</a></p>';
  }).catch(function(){});
}
})();
</script>
</body>
</html>
