   +'<div class="ad" id="ad-bot"><small>विज्ञापन</small></div>'
   +'<div id="relw"></div>'
   +'<h2>और Updates के लिए जुड़िए</h2><div class="two"><a class="btn" target="_blank" rel="noopener noreferrer" href="'+CFG.tg+'">Telegram Channel</a><a class="btn" target="_blank" rel="noopener noreferrer" href="'+CFG.wa+'">WhatsApp Channel</a></div>';
  show(h);
  var here=location.href,head=(p.uni?p.uni+": ":"")+p.title,plain=head+"\n"+here;
  $("s-wa").href="https://wa.me/?text="+encodeURIComponent("*"+head+"*\n"+here+"\n\nUniversity Gyaan");
  $("s-tg").href="https://t.me/share/url?url="+encodeURIComponent(here)+"&text="+encodeURIComponent(head);
  $("s-fb").href="https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(here);
  $("s-x").href="https://twitter.com/intent/tweet?text="+encodeURIComponent(head)+"&url="+encodeURIComponent(here);
  $("cp").onclick=function(){copyText(here).then(function(ok){toast(ok?"Link कॉपी हो गया":"कॉपी नहीं हो सका")})};
  $("s-ig").onclick=function(){
    if(navigator.share){navigator.share({title:head,text:head,url:here}).catch(function(){});return}
    copyText(plain).then(function(ok){toast(ok?"Link कॉपी हो गया। Instagram में चिपकाइए।":"Link कॉपी नहीं हो सका");if(ok)setTimeout(function(){window.open("https://www.instagram.com/","_blank","noopener")},900)})};
  var sy=$("s-sys");if(sy)sy.onclick=function(){navigator.share({title:head,text:head,url:here}).catch(function(){})};
  adBox($("ad-top"),CFG.slots.top);adBox($("ad-bot"),CFG.slots.bot);
  related(p,raw,mp);
}

function related(p,raw,mp){
  fetch(CFG.db+"/web/posts.json").then(function(r){return r.ok?r.json():{}}).then(function(o){
    o=o||{};
    var rows=Object.keys(o).map(function(k){var v=o[k];v.id=k;return v}).filter(function(v){return v&&!v.hide&&v.id!==id&&v.title&&v.uni===raw})
      .sort(function(a,b){return (b.ts||0)-(a.ts||0)}).slice(0,6);
    if(!rows.length)return;
    var m=mp[raw];
    $("relw").innerHTML='<h2>'+esc((m&&m.t)||raw)+' की और Updates</h2><div class="rel">'+rows.map(function(v){
      return '<a class="rl" href="notice.html?id='+encodeURIComponent(v.id)+'"><b>'+esc(v.title)+'</b><small>'+esc(TYPES[v.type]||"Notice")+(v.date?' · '+esc(fmt(v.date)):"")+'</small></a>'}).join("")+'</div>'
      +'<p style="text-align:center;margin-top:14px"><a class="btn" href="notices.html">सभी Updates देखिए</a></p>';
  }).catch(function(){});
}
})();
</script>
</body>
</html>
